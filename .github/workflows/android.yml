name: S1L0 TV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları al
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-33
            build-tools;33.0.2

      - name: Paketleri yükle
        run: npm install

      - name: Web dosyalarını hazırla
        run: npm run build

      - name: Android projesi oluştur
        run: npx cap add android

      - name: Android dosyalarını eşitle
        run: npx cap sync android

      - name: APK oluştur
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: S1L0-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
