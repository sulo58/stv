name: S1L0 TV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları al
        uses: actions/checkout@v5

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'
          log-accepted-android-sdk-licenses: false

      - name: Paketleri yükle
        run: npm install

      - name: Web dosyalarını hazırla
        run: npm run build

      - name: Android projesi oluştur
        run: npx cap add android

      - name: Video için donanım hızlandırmasını aç
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text(encoding="utf-8")
          application_tag = manifest.find("<application")
          if application_tag == -1:
              raise SystemExit("AndroidManifest.xml içinde application etiketi bulunamadı")
          tag_end = manifest.find(">", application_tag)
          if tag_end == -1:
              raise SystemExit("application etiketi tamamlanmamış")
          application = manifest[application_tag:tag_end]
          if "android:hardwareAccelerated=" not in application:
              manifest = manifest[:application_tag] + manifest[application_tag:tag_end] + ' android:hardwareAccelerated="true"' + manifest[tag_end:]
          manifest_path.write_text(manifest, encoding="utf-8")
          PY

      - name: TV geri tuşunu ana ekrana bağla
        run: |
          cat > android/app/src/main/java/com/silo/tv/MainActivity.java <<'EOF'
          package com.silo.tv;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onBackPressed() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      String currentUrl = getBridge().getWebView().getUrl();
                      if (currentUrl != null && !currentUrl.startsWith("https://localhost")) {
                          getBridge().getWebView().loadUrl("https://localhost/");
                          return;
                      }
                  }
                  super.onBackPressed();
              }
          }
          EOF

      - name: Android dosyalarını eşitle
        run: npx cap sync android

      - name: APK oluştur
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: S1L0-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
